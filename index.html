<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Version Tracker PWA</title>
    <!-- Tailwind CSS per un design moderno stile Android/Material -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-10 px-4 py-3 flex justify-between items-center shadow-md">
        <div>
            <h1 class="text-lg font-bold flex items-center gap-2">
                <span>📦</span> Version Tracker
            </h1>
        </div>
        <div class="flex items-center gap-2">
            <!-- Pulsante Esporta Backup -->
            <button onclick="esportaJSON()" title="Esporta Backup JSON" class="bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs px-2.5 py-2 rounded-lg font-medium flex items-center gap-1 transition">
                📥 Esporta
            </button>
            <!-- Pulsante Importa Backup (apre il file picker invisibile) -->
            <button onclick="document.getElementById('importFile').click()" title="Importa Backup JSON" class="bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs px-2.5 py-2 rounded-lg font-medium flex items-center gap-1 transition">
                📤 Importa
            </button>
            <input type="file" id="importFile" accept=".json" onchange="importaJSON(event)" class="hidden">

            <!-- Pulsante Aggiornamento Globale Web -->
            <button onclick="aggiornaTuttiDalWeb()" id="btnGlobalUpdate" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-3 py-2 rounded-lg font-medium flex items-center gap-1.5 transition shadow">
                <svg id="syncIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                Verifica
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-xl w-full mx-auto p-4 flex flex-col gap-4">

        <!-- Barra di Ricerca e Filtri -->
        <div class="flex flex-col gap-2">
            <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">🔍</span>
                <input type="text" id="searchInput" oninput="renderApp()" placeholder="Cerca modello, produttore o note..." class="w-full bg-slate-800 border border-slate-700 rounded-xl pl-10 pr-4 py-2.5 text-sm focus:outline-none focus:border-blue-500">
            </div>
            
            <div class="flex items-center justify-between gap-2 overflow-x-auto pb-1">
                <div class="flex gap-1.5">
                    <button onclick="setFilter('all')" id="filterAll" class="px-3 py-1 rounded-full text-xs font-medium bg-blue-600 text-white transition">Tutti</button>
                    <button onclick="setFilter('pending')" id="filterPending" class="px-3 py-1 rounded-full text-xs font-medium bg-slate-800 text-slate-300 border border-slate-700 transition">Da aggiornare</button>
                </div>
                <div class="text-xs text-slate-400" id="counterText">0 record</div>
            </div>
        </div>

        <!-- Lista Record -->
        <div id="recordsList" class="flex flex-col gap-3 pb-20">
            <!-- Inserito dinamicamente da JavaScript -->
        </div>
    </main>

    <!-- Floating Action Button (Nuovo Record) -->
    <button onclick="apriModalNuovo()" class="fixed bottom-6 right-6 bg-blue-600 hover:bg-blue-500 text-white w-14 h-14 rounded-full shadow-2xl flex items-center justify-center text-2xl font-bold transition transform hover:scale-105 active:scale-95">
        +
    </button>

    <!-- Modal Dettaglio & Note -->
    <div id="detailModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-md rounded-2xl p-5 flex flex-col gap-4 shadow-2xl">
            <div class="flex justify-between items-start">
                <div>
                    <span id="detailProduttore" class="text-xs font-semibold text-blue-400 uppercase tracking-wider">Produttore</span>
                    <h2 id="detailModello" class="text-xl font-bold text-white">Modello</h2>
                </div>
                <button onclick="chiudiModal()" class="text-slate-400 hover:text-white text-lg font-bold px-2">✕</button>
            </div>

            <div class="bg-slate-900/50 rounded-xl p-3 grid grid-cols-2 gap-2 text-sm border border-slate-700/50">
                <div>
                    <span class="text-slate-400 block text-xs">Installata</span>
                    <span id="detailVerInst" class="font-semibold text-slate-200">1.0.0</span>
                </div>
                <div>
                    <span class="text-slate-400 block text-xs">Attuale (Web)</span>
                    <span id="detailVerAtt" class="font-semibold text-emerald-400">1.0.0</span>
                </div>
            </div>

            <!-- Campo Note modificabile in tempo reale -->
            <div class="flex flex-col gap-1.5">
                <label class="text-xs font-medium text-slate-300">Note & Dettagli</label>
                <textarea id="detailNote" oninput="salvaNoteCorrenti(this.value)" rows="3" placeholder="Aggiungi note, password, posizioni..." class="bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-slate-200 focus:outline-none focus:border-blue-500"></textarea>
            </div>

            <div class="flex flex-col gap-2 pt-2">
                <button onclick="verificaSingoloWeb()" id="btnCheckSingle" class="w-full bg-slate-700 hover:bg-slate-600 text-slate-200 py-2.5 rounded-xl font-medium text-sm transition flex items-center justify-center gap-2">
                    🔄 Controlla aggiornamento online
                </button>
                <div class="flex gap-2">
                    <button onclick="allineaVersione()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white py-2.5 rounded-xl font-medium text-sm transition">
                        ✓ Segna come aggiornato
                    </button>
                    <button onclick="eliminaRecordCorrente()" class="bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white px-4 py-2.5 rounded-xl font-medium text-sm transition">
                        Elimina
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Nuovo Record -->
    <div id="addModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-md rounded-2xl p-5 flex flex-col gap-4 shadow-2xl">
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-bold text-white">Nuovo Record</h2>
                <button onclick="chiudiModalNuovo()" class="text-slate-400 hover:text-white text-lg font-bold px-2">✕</button>
            </div>

            <form id="addForm" onsubmit="salvaNuovoRecord(event)" class="flex flex-col gap-3">
                <div>
                    <label class="text-xs text-slate-300">Produttore *</label>
                    <input type="text" id="addProduttore" required placeholder="es. Samsung, MikroTik, Home Assistant" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="text-xs text-slate-300">Modello *</label>
                    <input type="text" id="addModello" required placeholder="es. Galaxy S23, RB4011, Core" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-xs text-slate-300">Versione Installata *</label>
                        <input type="text" id="addVerInst" required placeholder="es. 14.0" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="text-xs text-slate-300">Versione Attuale (Web)</label>
                        <input type="text" id="addVerAtt" placeholder="Lascia vuoto per ricerca auto" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
                    </div>
                </div>
                <div>
                    <label class="text-xs text-slate-300">Note (opzionale)</label>
                    <textarea id="addNote" rows="2" placeholder="Note descrittive..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-blue-500"></textarea>
                </div>
                <div class="pt-2 flex gap-2">
                    <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white py-2.5 rounded-xl font-medium text-sm transition">Salva</button>
                    <button type="button" onclick="chiudiModalNuovo()" class="bg-slate-700 hover:bg-slate-600 text-slate-300 px-4 py-2.5 rounded-xl font-medium text-sm transition">Annulla</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script Logica App -->
    <script>
        // Dati iniziali di esempio
        let records = JSON.parse(localStorage.getItem('version_tracker_data')) || [
            { id: '1', produttore: 'Home Assistant', modello: 'Core', versioneInstallata: '2024.3.1', versioneAttuale: '2024.3.1', note: 'Server principale Docker' },
            { id: '2', produttore: 'MikroTik', modello: 'RouterOS', versioneInstallata: '7.12', versioneAttuale: '7.14', note: 'Riavviare solo di notte' }
        ];

        let currentFilter = 'all';
        let selectedRecordId = null;

        function salvaStorage() {
            localStorage.setItem('version_tracker_data', JSON.stringify(records));
        }

        // Funzione di controllo versione via Web automatica (Soluzione 3)
        async function fetchVersionFromWeb(produttore, modello) {
            try {
                // Tenta ricerca automatica su cataloghi pubblici (es. GitHub API per software/firmware)
                const query = encodeURIComponent(`${produttore} ${modello}`);
                const response = await fetch(`https://api.github.com/search/repositories?q=${query}&per_page=1`);
                const data = await response.json();
                
                if (data.items && data.items.length > 0) {
                    const repo = data.items[0];
                    const relRes = await fetch(`https://api.github.com/repos/${repo.owner.login}/${repo.name}/releases/latest`);
                    if (relRes.ok) {
                        const relData = await relRes.json();
                        let tag = relData.tag_name || relData.name;
                        return tag.replace(/^v/i, '');
                    }
                }
                // Se non è un progetto GitHub pubblico, restituisce un valore simulato o invariato
                return null;
            } catch (e) {
                return null;
            }
        }

        function renderApp() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const listEl = document.getElementById('recordsList');
            
            const filtered = records.filter(r => {
                const matchSearch = r.modello.toLowerCase().includes(search) || 
                                    r.produttore.toLowerCase().includes(search) || 
                                    r.note.toLowerCase().includes(search);
                const isOutdated = r.versioneInstallata.trim() !== r.versioneAttuale.trim();
                
                if (currentFilter === 'pending') return matchSearch && isOutdated;
                return matchSearch;
            });

            document.getElementById('counterText').innerText = `${filtered.length} record`;

            if (filtered.length === 0) {
                listEl.innerHTML = `<div class="text-center py-12 text-slate-500 text-sm">Nessun record trovato</div>`;
                return;
            }

            listEl.innerHTML = filtered.map(r => {
                const outdated = r.versioneInstallata.trim() !== r.versioneAttuale.trim();
                return `
                    <div onclick="apriDettaglio('${r.id}')" class="bg-slate-800/80 hover:bg-slate-800 border border-slate-700/70 rounded-2xl p-4 transition shadow-sm active:scale-[0.99] cursor-pointer flex flex-col gap-2">
                        <div class="flex justify-between items-start">
                            <div>
                                <span class="text-xs font-semibold text-blue-400 uppercase tracking-wide">${r.produttore}</span>
                                <h3 class="text-base font-bold text-white">${r.modello}</h3>
                            </div>
                            <span class="text-xs px-2.5 py-1 rounded-full font-medium ${outdated ? 'bg-red-500/10 text-red-400 border border-red-500/20' : 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20'}">
                                ${outdated ? '⚠️ Aggiornamento disponibile' : '✓ Aggiornato'}
                            </span>
                        </div>
                        <div class="grid grid-cols-2 gap-2 text-xs pt-1 border-t border-slate-700/50 text-slate-300">
                            <div>Installata: <span class="font-semibold text-white">${r.versioneInstallata}</span></div>
                            <div>Attuale: <span class="font-semibold text-emerald-400">${r.versioneAttuale}</span></div>
                        </div>
                        ${r.note ? `<div class="text-xs text-slate-400 truncate mt-0.5">📝 ${r.note}</div>` : ''}
                    </div>
                `;
            }).join('');
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.getElementById('filterAll').className = `px-3 py-1 rounded-full text-xs font-medium transition ${filter === 'all' ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-300 border border-slate-700'}`;
            document.getElementById('filterPending').className = `px-3 py-1 rounded-full text-xs font-medium transition ${filter === 'pending' ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-300 border border-slate-700'}`;
            renderApp();
        }

        // Dettaglio & Note
        function apriDettaglio(id) {
            selectedRecordId = id;
            const r = records.find(item => item.id === id);
            if (!r) return;

            document.getElementById('detailProduttore').innerText = r.produttore;
            document.getElementById('detailModello').innerText = r.modello;
            document.getElementById('detailVerInst').innerText = r.versioneInstallata;
            document.getElementById('detailVerAtt').innerText = r.versioneAttuale;
            document.getElementById('detailNote').value = r.note || '';
            document.getElementById('detailModal').classList.remove('hidden');
        }

        function chiudiModal() {
            document.getElementById('detailModal').classList.add('hidden');
            selectedRecordId = null;
        }

        function salvaNoteCorrenti(val) {
            if (!selectedRecordId) return;
            const r = records.find(item => item.id === selectedRecordId);
            if (r) {
                r.note = val;
                salvaStorage();
            }
        }

        function allineaVersione() {
            if (!selectedRecordId) return;
            const r = records.find(item => item.id === selectedRecordId);
            if (r) {
                r.versioneInstallata = r.versioneAttuale;
                salvaStorage();
                renderApp();
                apriDettaglio(selectedRecordId);
            }
        }

        function eliminaRecordCorrente() {
            if (!selectedRecordId) return;
            if (confirm('Vuoi eliminare questo record?')) {
                records = records.filter(item => item.id !== selectedRecordId);
                salvaStorage();
                chiudiModal();
                renderApp();
            }
        }

        async function verificaSingoloWeb() {
            if (!selectedRecordId) return;
            const r = records.find(item => item.id === selectedRecordId);
            if (!r) return;

            const btn = document.getElementById('btnCheckSingle');
            btn.innerText = "⏳ Ricerca online in corso...";
            btn.disabled = true;

            const nuovaVer = await fetchVersionFromWeb(r.produttore, r.modello);
            if (nuovaVer) {
                r.versioneAttuale = nuovaVer;
                salvaStorage();
                document.getElementById('detailVerAtt').innerText = r.versioneAttuale;
                renderApp();
                alert(`Aggiornamento trovato: ${nuovaVer}`);
            } else {
                alert("Nessuna nuova versione trovata automaticamente sui cataloghi pubblici per questo modello.");
            }

            btn.innerText = "🔄 Controlla aggiornamento online";
            btn.disabled = false;
        }

        async function aggiornaTuttiDalWeb() {
            const btn = document.getElementById('btnGlobalUpdate');
            btn.style.opacity = "0.7";
            
            let aggiornati = 0;
            for (let r of records) {
                const nuovaVer = await fetchVersionFromWeb(r.produttore, r.modello);
                if (nuovaVer && nuovaVer !== r.versioneAttuale) {
                    r.versioneAttuale = nuovaVer;
                    aggiornati++;
                }
            }

            salvaStorage();
            renderApp();
            btn.style.opacity = "1";
            alert(`Controllo completato! Aggiornati ${aggiornati} record.`);
        }

        // Nuovo Record
        function apriModalNuovo() {
            document.getElementById('addForm').reset();
            document.getElementById('addModal').classList.remove('hidden');
        }

        function chiudiModalNuovo() {
            document.getElementById('addModal').classList.add('hidden');
        }

        async function salvaNuovoRecord(e) {
            e.preventDefault();
            const produttore = document.getElementById('addProduttore').value;
            const modello = document.getElementById('addModello').value;
            const verInst = document.getElementById('addVerInst').value;
            let verAtt = document.getElementById('addVerAtt').value;
            const note = document.getElementById('addNote').value;

            if (!verAtt) {
                // Tenta ricerca automatica al volo se non inserita
                const trovata = await fetchVersionFromWeb(produttore, modello);
                verAtt = trovata || verInst;
            }

            const nuovo = {
                id: Date.now().toString(),
                produttore,
                modello,
                versioneInstallata: verInst,
                versioneAttuale: verAtt,
                note
            };

            records.unshift(nuovo);
            salvaStorage();
            chiudiModalNuovo();
            renderApp();
        }

        // Inizializzazione
        renderApp();
    </script>

    <!-- Service Worker PWA -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(() => {});
            });
        }
    </script>
    <script>
        // ESORTAZIONE BACKUP JSON
        function esportaJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(records, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `version_tracker_backup_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        // IMPORTAZIONE BACKUP JSON
        function importaJSON(event) {
            const fileReader = new FileReader();
            if (event.target.files[0]) {
                fileReader.readAsText(event.target.files[0], "UTF-8");
                fileReader.onload = function (e) {
                    try {
                        const importedData = JSON.parse(e.target.result);
                        if (Array.isArray(importedData)) {
                            if (confirm(`Trovati ${importedData.length} record nel file. Vuoi sostituire l'archivio attuale o fonderli? \n[OK] = Sostituisci tutto, [Annulla] = Annulla`)) {
                                records = importedData;
                                salvaStorage();
                                renderApp();
                                alert("Backup importato con successo!");
                            }
                        } else {
                            alert("Il file non è in un formato valido.");
                        }
                    } catch (error) {
                        alert("Errore durante la lettura del file JSON.");
                    }
                    // Reset input file
                    event.target.value = '';
                };
            }
        }
    </script>
</body>
</html>
